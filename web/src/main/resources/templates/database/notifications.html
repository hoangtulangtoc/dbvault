<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(#{targetNotifications.title}, 'targets', ~{:: #content})}">
<body><div id="content">
  <div class="page-header"><div><div class="eyebrow" th:text="#{nav.notifications}">Notifications</div>
    <h1 th:text="#{targetNotifications.heading(${target.name})}">Notifications for production</h1>
    <p th:text="#{targetNotifications.intro}">Restore events follow the destination target. Delivery failures never change a backup or restore result.</p></div></div>

  <form class="form-panel" method="post" th:object="${form}"
        th:action="@{/databases/{id}/notifications(id=${target.id})}">
    <div th:replace="~{fragments/form-errors :: formErrors}"></div>
    <p class="empty-state" th:if="${channels.isEmpty()}"><th:block th:text="#{targetNotifications.empty}">No channels exist yet.</th:block>
      <a th:href="@{/notifications/new}" th:text="#{targetNotifications.create}">Create a notification channel</a>.</p>
    <div class="stack" th:unless="${channels.isEmpty()}">
      <section class="panel" th:each="row, stat : *{rows}">
        <input type="hidden" th:field="*{rows[__${stat.index}__].channelId}">
        <label><input type="checkbox" th:field="*{rows[__${stat.index}__].included}">
          <strong th:text="${channels[stat.index].name}">Operations</strong>
          <span class="badge badge-neutral" th:text="${channels[stat.index].type.displayName}">Webhook</span></label>
        <div class="actions" style="margin-top:.7rem">
          <label th:each="event : ${events}"><input type="checkbox"
              th:field="*{rows[__${stat.index}__].events}" th:value="${event}">
            <span th:text="#{${'event.' + event.name()}}">BACKUP FAILED</span></label>
        </div>
        <p class="field-error" th:if="${#fields.hasErrors('rows[' + stat.index + '].events')}"
           th:errors="*{rows[__${stat.index}__].events}">Choose at least one event.</p>
      </section>
    </div>
    <div class="form-actions"><button class="button button-primary" type="submit" th:text="#{targetNotifications.save}">Save subscriptions</button>
      <a class="button button-ghost" th:href="@{/databases}" th:text="#{common.cancel}">Cancel</a></div>
  </form>
</div></body></html>
