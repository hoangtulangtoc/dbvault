<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(${policy == null ? #messages.msg('retention.enable.title') : #messages.msg('retention.edit.title')}, 'retention', ~{:: #content})}">
<body>
<div id="content">
  <div class="page-header">
    <div>
      <div class="eyebrow" th:text="#{common.automation}">Automation</div>
      <h1 th:text="${policy == null ? #messages.msg('retention.enable.title') : #messages.msg('retention.edit.title')}">Enable retention</h1>
      <p><th:block th:text="#{retention.form.target}">Target:</th:block> <strong th:text="${target.name}">production</strong>. <th:block th:text="#{retention.form.firstRun}">The policy first runs after its next successful backup.</th:block></p>
    </div>
  </div>

  <form class="form-panel" method="post" th:object="${form}"
        th:action="@{/retention/{id}(id=${target.id})}">
    <div th:replace="~{fragments/form-errors :: formErrors}"></div>

    <div class="form-group">
      <label for="keepSuccessful" th:text="#{retention.form.keep}">Successful backups to keep</label>
      <input id="keepSuccessful" type="number" min="1" step="1" inputmode="numeric"
             th:field="*{keepSuccessful}" autofocus
             aria-describedby="retention-help"
             th:classappend="${#fields.hasErrors('keepSuccessful')} ? 'input-error'">
      <p class="field-hint" id="retention-help" th:text="#{retention.form.keep.hint}">
        Backups with restore history are always kept in addition to this number. Failed and running attempts are never pruned.
      </p>
      <div th:replace="~{fragments/field-error :: fieldError('keepSuccessful')}"></div>
    </div>

    <div class="form-actions">
      <button class="button button-primary" type="submit" th:attr="data-busy-label=#{targetForm.saving}" th:text="#{retention.form.save}">Save retention policy</button>
      <a class="button button-ghost" th:href="@{/retention}" th:text="#{common.cancel}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
