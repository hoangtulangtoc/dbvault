<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(${editing == null ? #messages.msg('storageForm.add.title') : #messages.msg('storageForm.edit.title')}, 'storage', ~{:: #content})}">
<body><div id="content">
  <div class="page-header"><div><div class="eyebrow" th:text="#{nav.storage}">Storage</div>
    <h1 th:text="${editing == null ? #messages.msg('storage.add') : #messages.msg('targetForm.edit.heading', editing.name)}">Add S3 profile</h1>
    <p th:text="#{storageForm.intro}">The bucket must already exist. Prefer HTTPS endpoints in production.</p></div></div>
  <form class="form-panel" method="post" th:object="${form}"
        th:action="@{${editing == null ? '/storage' : '/storage/' + editing.id}}">
    <div th:replace="~{fragments/form-errors :: formErrors}"></div>
    <div class="form-grid">
      <div class="form-group form-group-full"><label for="name" th:text="#{targets.col.name}">Name</label><input id="name" th:field="*{name}" autofocus></div>
      <div class="form-group form-group-full"><label for="endpoint" th:text="#{storage.col.endpoint}">Endpoint</label><input id="endpoint" type="url" th:field="*{endpoint}" data-storage-endpoint placeholder="https://s3.example.com">
        <p class="field-hint" th:text="#{storageForm.endpoint.hint}">Leave empty for AWS S3. Custom endpoints must be HTTP or HTTPS without query parameters.</p></div>
      <div class="form-group"><label for="region" th:text="#{storageForm.region}">Region</label><input id="region" th:field="*{region}" placeholder="us-east-1"></div>
      <div class="form-group"><label for="bucket" th:text="#{storage.col.bucket}">Bucket</label><input id="bucket" th:field="*{bucket}"></div>
      <div class="form-group"><label for="keyPrefix" th:text="#{storageForm.keyPrefix}">Key prefix</label><input id="keyPrefix" th:field="*{keyPrefix}" placeholder="database-backups"></div>
      <div class="form-group"><label><input type="checkbox" th:field="*{pathStyle}" data-storage-path-style> <th:block th:text="#{storageForm.pathStyle}">Use path-style access</th:block></label>
        <p class="field-hint" th:text="#{storageForm.pathStyle.hint}">Usually required by S3-compatible development servers.</p></div>
      <div class="form-group"><label for="credentialMode" th:text="#{storage.col.credentials}">Credentials</label><select id="credentialMode" th:field="*{credentialMode}">
        <option th:each="mode : ${credentialModes}" th:value="${mode}" th:text="${mode.name() == 'STATIC' ? #messages.msg('storage.credentials.static') : #messages.msg('storageForm.credentials.chain')}"></option></select></div>
      <div class="form-group"><label for="accessKeyId" th:text="#{storageForm.accessKeyId}">Access key ID</label><input id="accessKeyId" th:field="*{accessKeyId}" autocomplete="off"></div>
      <div class="form-group form-group-full"><label for="secretAccessKey" th:text="#{storageForm.secret}">Secret access key</label><input id="secretAccessKey" name="secretAccessKey" type="password" autocomplete="new-password">
        <p class="field-hint" th:text="${editing == null ? #messages.msg('storageForm.secret.hint.add') : #messages.msg('storageForm.secret.hint.edit')}"></p></div>
    </div>
    <div class="form-actions"><button class="button button-primary" type="submit" th:text="#{storageForm.save}">Save profile</button><a class="button button-ghost" th:href="@{/storage}" th:text="#{common.cancel}">Cancel</a></div>
  </form>
</div></body></html>
