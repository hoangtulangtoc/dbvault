<div xmlns:th="http://www.thymeleaf.org">
  <span th:fragment="statusBadge(status)"
        class="badge"
        th:classappend="${status.name() == 'SUCCEEDED' ? 'badge-success'
                        : (status.name() == 'FAILED' ? 'badge-danger' : 'badge-warning')}"
        th:text="${#messages.msg('status.' + status.name())}">Running</span>
</div>
