<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(${editing == null ? #messages.msg('channelForm.add.title') : #messages.msg('channelForm.edit.title')}, 'notifications', ~{:: #content})}">
<body><div id="content">
  <div class="page-header"><div><div class="eyebrow" th:text="#{nav.notifications}">Notifications</div>
    <h1 th:text="${editing == null ? #messages.msg('channelForm.add.heading', channelType.displayName) : #messages.msg('targetForm.edit.heading', editing.name)}">Add channel</h1>
    <p th:text="#{channelForm.intro}">Sending a test performs a real delivery to this destination.</p></div></div>
  <form class="form-panel" method="post" th:object="${form}"
        th:action="@{${editing == null ? '/notifications' : '/notifications/' + editing.id}}">
    <input type="hidden" th:field="*{type}">
    <div th:replace="~{fragments/form-errors :: formErrors}"></div>
    <div class="form-grid">
      <div class="form-group form-group-full"><label for="name" th:text="#{targets.col.name}">Name</label>
        <input id="name" type="text" th:field="*{name}" maxlength="100" autofocus>
        <div th:replace="~{fragments/field-error :: fieldError('name')}"></div></div>

      <div class="form-group form-group-full" th:if="${channelType.name() == 'SLACK'}"><label for="webhookUrl" th:text="#{channelForm.slackUrl}">Slack incoming webhook URL</label>
        <input id="webhookUrl" name="webhookUrl" type="password" autocomplete="new-password" placeholder="https://hooks.slack.com/services/…">
        <p class="field-hint" th:text="${editing == null ? #messages.msg('channelForm.slackUrl.hint.add') : #messages.msg('channelForm.slackUrl.hint.edit')}"></p></div>

      <div class="form-group form-group-full" th:if="${channelType.name() == 'WEBHOOK'}"><label for="webhookUrl" th:text="#{channelForm.webhookUrl}">Webhook URL</label>
        <input id="webhookUrl" name="webhookUrl" type="password" autocomplete="new-password" placeholder="https://alerts.example.com/dbvault">
        <p class="field-hint" th:text="${editing == null ? #messages.msg('channelForm.webhookUrl.hint.add') : #messages.msg('channelForm.webhookUrl.hint.edit')}"></p></div>

      <div class="form-group form-group-full" th:if="${channelType.name() == 'EMAIL'}"><label for="emailTo" th:text="#{channelForm.emailTo}">Email recipient</label>
        <input id="emailTo" type="email" th:field="*{emailTo}" maxlength="255">
        <p class="field-hint" th:text="#{channelForm.emailTo.hint}">SMTP transport is configured deployment-wide.</p></div>
    </div>
    <div class="form-actions"><button class="button button-primary" type="submit" th:text="#{channelForm.save}">Save channel</button>
      <a class="button button-ghost" th:href="@{/notifications}" th:text="#{common.cancel}">Cancel</a></div>
  </form>
</div></body></html>
