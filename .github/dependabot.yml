# Weekly version updates, opened against develop like every other change (docs/branching.md).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
  # The Dockerfile and docker-compose.yml pin images by digest; these propose the next digest.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
