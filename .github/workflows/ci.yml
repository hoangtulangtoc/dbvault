name: CI

on:
  push:
    # Every branch GitFlow merges from, so a release branch is already proven
    # before it reaches main. feature/* is covered by its pull request.
    branches: [main, develop, 'release/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The application drives these binaries and the integration tests run
      # them against a real server. Their absence must fail the job, never
      # make a test skip itself.
      - name: Install the MySQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          test -x /usr/bin/mysql
          test -x /usr/bin/mysqldump

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
