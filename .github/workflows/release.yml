name: Release

# A v* tag publishes the container image. The GitHub Release itself is written
# by the release-notes tool once the notes are approved; when it is published,
# the server jar is attached to it.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  image:
    name: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  jar:
    name: attach jar
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The tests already ran on the tagged commit's branch; this only packages it.
      - name: Package
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp web/target/web-*.jar "dbvault-${TAG#v}.jar"
          sha256sum "dbvault-${TAG#v}.jar" > "dbvault-${TAG#v}.jar.sha256"
          gh release upload "$TAG" "dbvault-${TAG#v}.jar" "dbvault-${TAG#v}.jar.sha256" --clobber
