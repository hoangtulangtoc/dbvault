# Local development dependencies. One service so far: the PostgreSQL instance
# where this tool keeps its own metadata. The application itself still runs
# from Maven at this point; it gets an image in the packaging slice.

services:
  postgres:
    image: postgres:17-alpine
    container_name: dbvault-postgres
    environment:
      POSTGRES_DB: dbvault
      POSTGRES_USER: dbvault
      POSTGRES_PASSWORD: dbvault
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbvault -d dbvault"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
