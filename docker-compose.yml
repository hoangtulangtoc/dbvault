# Everything needed to run this tool: the application, and the PostgreSQL it
# keeps its own metadata in. Nothing on the host but Docker.
#
#   echo "ENCRYPTION_SECRET_KEY=$(openssl rand -base64 32)" > .env
#   docker run --rm -it httpd:2.4-alpine htpasswd -nBC 12 ""
#     (type the console password twice; it prints ":$2y$12$…")
#   echo "OPERATOR_PASSWORD_HASH='\$2y\$12\$…'" >> .env
#     (the printed hash without its leading colon, in single quotes —
#      unquoted, compose reads every $ in it as the start of a variable)
#   docker compose up --build
#
# For local development against a Maven-run application, `docker compose up -d
# postgres` starts just the metadata store.

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: dbvault-postgres
    environment:
      POSTGRES_DB: dbvault
      POSTGRES_USER: dbvault
      POSTGRES_PASSWORD: dbvault
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbvault -d dbvault"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: dbvault
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dbvault
      DB_USERNAME: dbvault
      DB_PASSWORD: dbvault
      # No default. Starting without it fails loudly, which is the right
      # outcome: a default key would mean every stored password is protected by
      # a secret published in this repository.
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      # The one account that can sign in to the console. The hash likewise has
      # no default: without it the application refuses to start. See ADR-011.
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-admin}
      OPERATOR_PASSWORD_HASH: ${OPERATOR_PASSWORD_HASH}
      STORAGE_STAGING_DIR: /var/lib/dbvault/backups/.staging
      # Optional deployment-wide transport for Email notification channels.
      DBVAULT_SMTP_HOST: ${DBVAULT_SMTP_HOST:-}
      DBVAULT_SMTP_PORT: ${DBVAULT_SMTP_PORT:-587}
      DBVAULT_SMTP_USERNAME: ${DBVAULT_SMTP_USERNAME:-}
      DBVAULT_SMTP_PASSWORD: ${DBVAULT_SMTP_PASSWORD:-}
      DBVAULT_SMTP_FROM: ${DBVAULT_SMTP_FROM:-dbvault@localhost}
      DBVAULT_SMTP_AUTH: ${DBVAULT_SMTP_AUTH:-true}
      DBVAULT_SMTP_STARTTLS: ${DBVAULT_SMTP_STARTTLS:-true}
      # Restore verification stays off unless the operator deliberately enables
      # it and grants Docker-socket access below.
      DBVAULT_VERIFICATION_ENABLED: ${DBVAULT_VERIFICATION_ENABLED:-false}
      DBVAULT_VERIFICATION_MYSQL_IMAGE: ${DBVAULT_VERIFICATION_MYSQL_IMAGE:-mysql:8.4}
      DBVAULT_VERIFICATION_POSTGRESQL_IMAGE: ${DBVAULT_VERIFICATION_POSTGRESQL_IMAGE:-postgres:17-alpine}
      DBVAULT_VERIFICATION_MONGODB_IMAGE: ${DBVAULT_VERIFICATION_MONGODB_IMAGE:-mongo:8.0}
      DBVAULT_VERIFICATION_PULL_TIMEOUT: ${DBVAULT_VERIFICATION_PULL_TIMEOUT:-10m}
      DBVAULT_VERIFICATION_STARTUP_TIMEOUT: ${DBVAULT_VERIFICATION_STARTUP_TIMEOUT:-2m}
      DBVAULT_VERIFICATION_CLEANUP_TIMEOUT: ${DBVAULT_VERIFICATION_CLEANUP_TIMEOUT:-30s}
    ports:
      - "8080:8080"
    volumes:
      # Named, not bind-mounted: the artifacts outlive the container, and
      # nothing about them belongs in the source tree.
      - backups:/var/lib/dbvault/backups
      # Opt-in restore verification. docker.sock grants root-equivalent control
      # of the host. Uncomment this and group_add only after accepting that
      # boundary; set DOCKER_SOCKET_GID to `stat -c '%g' /var/run/docker.sock`
      # on the host.
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_SOCKET_GID:-999}"
    # A target database running on the host is reachable as
    # host.docker.internal from inside this container. On Linux that name does
    # not exist without this line; on Docker Desktop it is harmless.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional monitoring (DBV-30): `docker compose --profile observability up -d`.
  # Neither publishes a port, so nothing new is opened on the host; to look at
  # Grafana, add a ports mapping in an override file (docs/deployment.md).
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      # Written by the operator, never committed (see prometheus.yml).
      - ./observability/prometheus/dbvault-password:/etc/prometheus/dbvault-password:ro,Z
      - prometheus-data:/prometheus
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    profiles: ["observability"]
    environment:
      # Read from a file the operator writes, so a plain `docker compose up`
      # without this profile needs nothing set:
      #   printf '%s' 'a-grafana-password' > observability/grafana/admin-password
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/admin-password:/run/secrets/grafana-admin-password:ro,Z
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  backups:
  prometheus-data:
  grafana-data:
